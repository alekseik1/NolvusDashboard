name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            p7zip-full \
            xdelta3

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Nolvus.Dashboard/Nolvus.Dashboard.csproj || echo "0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "Nolvus Dashboard Linux.sln" -r linux-x64

      - name: Publish Dashboard
        run: |
          dotnet publish Nolvus.Dashboard/Nolvus.Dashboard.csproj \
            -c Release -r linux-x64 --no-restore \
            -o bin/Dashboard

      - name: Publish Updater
        run: |
          dotnet publish Nolvus.Updater/Nolvus.Updater.csproj \
            -c Release -r linux-x64 --no-restore \
            -o bin/Updater

      - name: Package
        run: |
          mkdir -p bin/Nolvus/lib/Patches
          cp -a bin/Dashboard/. bin/Nolvus/
          cp -a bin/Updater/.   bin/Nolvus/
          cp Nolvus.Dashboard/Assets/nolvus-ico.jpg bin/Nolvus/ || true

          cp "$(which 7z)"      bin/Nolvus/lib/7z
          cp "$(which xdelta3)" bin/Nolvus/lib/xdelta3

          chmod +x bin/Nolvus/NolvusDashboard bin/Nolvus/NolvusUpdater 2>/dev/null || true
          chmod +x bin/Nolvus/lib/7z bin/Nolvus/lib/xdelta3

          cd bin
          tar -czf "NolvusDashboard-${{ steps.version.outputs.version }}-linux-x64.tar.gz" Nolvus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NolvusDashboard-${{ steps.version.outputs.version }}-linux-x64
          path: bin/NolvusDashboard-${{ steps.version.outputs.version }}-linux-x64.tar.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/NolvusDashboard-${{ steps.version.outputs.version }}-linux-x64.tar.gz
